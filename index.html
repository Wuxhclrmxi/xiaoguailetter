<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
     <style>
        /* ——— 阴沉基调 ——— */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0b090a;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 3rem 1.5rem;
            font-family: 'Georgia', 'Times New Roman', '宋体', serif;
            position: relative;
            overflow-x: hidden;
        }
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(30, 20, 20, 0.6) 0%, transparent 70%),
                radial-gradient(ellipse at 80% 30%, rgba(20, 10, 10, 0.5) 0%, transparent 60%),
                repeating-linear-gradient(45deg,
                    rgba(0, 0, 0, 0.03) 0px,
                    rgba(0, 0, 0, 0.03) 2px,
                    rgba(255, 255, 255, 0.01) 2px,
                    rgba(255, 255, 255, 0.01) 4px);
            pointer-events: none;
            z-index: 1;
        }

        .diary {
            position: relative;
            z-index: 2;
            max-width: 760px;
            width: 100%;
            background: rgba(18, 14, 15, 0.85);
            backdrop-filter: blur(2px);
            padding: 3rem 2.8rem;
            border: 1px solid rgba(80, 60, 55, 0.3);
            border-radius: 4px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.8),
                inset 0 1px 0 rgba(120, 90, 80, 0.15),
                inset 0 -1px 0 rgba(0, 0, 0, 0.5);
        }

        /* ——— 每一条日记 ——— */
        .entry {
            margin-bottom: 3.2rem;
            padding-bottom: 2.4rem;
            border-bottom: 1px solid rgba(80, 60, 55, 0.15);
            color: #b8a9a0;
            line-height: 2.1;
            font-size: 1.05rem;
            letter-spacing: 0.03em;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
        }
        .entry:last-child {
            border-bottom: none;
            margin-bottom: 0;
        }

        /* 日期 —— 每个条目最前面 */
        .entry-date {
            font-size: 0.95rem;
            color: #7a655a;
            letter-spacing: 0.15em;
            margin-bottom: 0.8rem;
            font-style: italic;
            text-indent: 0;
        }

        /* 正文 —— 保留换行，不需要任何格式 */
        .entry-text {
            text-indent: 2em;
            white-space: pre-wrap;    /* 保留你敲的空行和换行 */
            word-break: break-word;
        }

        /* ——— 响应式 ——— */
        @media (max-width: 600px) {
            .diary {
                padding: 2rem 1.2rem;
            }
            .entry {
                font-size: 0.95rem;
                line-height: 2;
                margin-bottom: 2.4rem;
                padding-bottom: 1.8rem;
            }
        }

        /* ——— 滚动条 ——— */
        ::-webkit-scrollbar {
            width: 6px;
            background: #0b090a;
        }
        ::-webkit-scrollbar-thumb {
            background: #2d211c;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #3d2d26;
        }

        /* ——— 微尘 ——— */
        .dust {
            position: fixed;
            border-radius: 50%;
            background: rgba(180, 150, 130, 0.05);
            pointer-events: none;
            z-index: 0;
            animation: floatDust linear infinite alternate;
        }
        .dust:nth-child(1) {
            width: 4px;
            height: 4px;
            top: 12%;
            left: 8%;
            animation-duration: 18s;
        }
        .dust:nth-child(2) {
            width: 7px;
            height: 7px;
            top: 45%;
            right: 5%;
            animation-duration: 23s;
            animation-delay: -6s;
        }
        .dust:nth-child(3) {
            width: 3px;
            height: 3px;
            bottom: 20%;
            left: 15%;
            animation-duration: 15s;
            animation-delay: -10s;
        }
        .dust:nth-child(4) {
            width: 5px;
            height: 5px;
            top: 70%;
            right: 12%;
            animation-duration: 20s;
            animation-delay: -3s;
        }
        .dust:nth-child(5) {
            width: 6px;
            height: 6px;
            top: 30%;
            left: 80%;
            animation-duration: 25s;
            animation-delay: -14s;
        }
        @keyframes floatDust {
            0% {
                transform: translate(0, 0) scale(1);
                opacity: 0.2;
            }
            100% {
                transform: translate(30px, -40px) scale(1.6);
                opacity: 0.6;
            }
        }
    </style>
</head>
<body>

    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>
    <div class="dust"></div>

    <div class="diary" id="diaryRoot">
        <!-- 由 JavaScript 自动生成 -->
    </div>

    <script>
        // ================================================================
        //  🌙 日记数据 —— 你以后只需要在这里加新条目
        //  格式：{ date: "日期", content: "内容（可以随便换行）" }
        //  新条目加在 **最前面**，这样最新看的放在最上面。
        // ================================================================
        const entries = [
            // ↓↓↓ 在这里粘贴新日记（复制下面这个格式，放在最顶上） ↓↓↓
           {
    date: "2026.08.26 ",
    content: `快开学了。今天太阳很烈。假期只出了一次远门，终日里在家无所事事，只睡觉和打游戏。好事是轻了不少，快两位数了。
    希望你一切都好。
    另，明天中元，晚上最好少出门吧。`
},
            {
                date: "2026.08.25 凌晨",
                content: `昨晚梦到你了，梦到你给我发消息，就发了一个字，后面一条十几个字的消息撤回了。
        梦里的我比现实还要决绝一点，我第一反应抗拒着想逃离，但是最终还是拿着手机询问怎么了，
        我骗自己万一是你有什么急事需要我帮忙呢。 后面我们复合了，从复合的那一刻我就知道我在梦里了。
        那一瞬间突然想起现实里每个无法入睡的深夜，想起一遍又一遍不愿意提起但烂熟于心的号码。
        这也是我二十年来唯一一次清醒着知道自己在做梦。
        但是，我还没有醒。我不愿醒着。

        我有在写歌。最近。我想离开这里和各种掺杂的情绪，那天晚上坐火车，凌晨两点多我靠窗看外面的灯火，写了一些歌。我不想写和你有关的任何东西，可我好像只会写这些了。

        其实我确实学到很多东西。我想你对我的影响比你心里想的和我当初所预估的都要深的多。
        我确实不是一个随便投入感情的人。阿林。希望这样称呼你不会让你感到不适。不过哪怕是现在我还庆幸…难过的是我。

        我愿意你快乐幸福的过一生的。也希望你美满。我不想你人生或者伴侣出现任何的差池，我希望你身边的人都比我更加珍惜你，不然我只会更加痛苦。我不想你受一点委屈了。我知道我们相处的时候你也会委屈的。我…我可不太懂怎么去爱你。但是，我现在彻失去爱人的能力了。也许是好事。

        我很痛苦。每一天。但这不是你或者我的原因。我不想等到你彻底厌烦我的那天，还是想保留一点最后的尊严。也许没保留住?我不知道了。我只知道接近厌烦的边缘，我不敢再去碰触了。

        其实我真的真的很讨厌卖惨的。可是真的算不甘心吧。虽然也是我咎由自取。

        未来有那么多那么多可能，真的找不到一个和我有关的吗?其实也可以有对不对。但是我贪心不足，我想要更多，想要靠前一点的位置。这个做不到，对不对。

        其实我也很想见你，想给你涂白色的睫毛膏，想要你牵住我。 我的手好凉。`
            }
            // ↑↑↑ 新日记加在上面 ↑↑↑
        ];

        // ——— 渲染 ———
        const root = document.getElementById('diaryRoot');
        function render() {
            let html = '';
            for (let i = 0; i < entries.length; i++) {
                const e = entries[i];
                // 把内容里的换行保留下来（white-space: pre-wrap 会配合）
                html += `
                    <div class="entry">
                        <div class="entry-date">${e.date}</div>
                        <div class="entry-text">${e.content}</div>
                    </div>
                `;
            }
            root.innerHTML = html;
        }
        render();
    </script>

</body>
</html>
